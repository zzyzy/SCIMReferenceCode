name: Build

on: [push, pull_request]

jobs:
  build:
    # windows-latest is required: the solution's net48 leg needs the .NET Framework 4.8
    # targeting pack, and Microsoft.SCIM.WebHostSample.Net48 self-hosts on HttpListener.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Microsoft.SCIM.sln
      - run: dotnet build Microsoft.SCIM.sln -c Release --no-restore
